name: Update Recent Commits Activity

on:
  schedule:
    - cron: '0 */6 * * *' # Ogni 6 ore
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/update_commits.py'

permissions:
  contents: write

jobs:
  update-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Commits Updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/update_commits.py

      - name: Commit & Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes in README.md"
          else
            git commit -m "docs: auto-update recent commit history [skip ci]"
            git push
          fi
